# ============================================================
# Nginx Security Headers & Hardening Directives
# Included in all server and location blocks
# ============================================================

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Cross-Site Scripting (XSS) filter
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature and Permissions Policy (restrict dangerous browser APIs)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Cross-Origin Isolation Policies (COOP & CORP)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content Security Policy (allows self, scripts, fonts, and styles for institutional UI)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
