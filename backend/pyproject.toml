[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proyecto-hv-backend"
version = "0.1.0"
description = "Plataforma de gestión y análisis de hojas de vida"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # ---- Web Framework ----
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # ---- Validation / Settings ----
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",

    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ---- Security ----
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",

    # ---- Cache / Queue ----
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",

    # ---- PDF Processing ----
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",

    # ---- HTTP Client (for OCR providers) ----
    "httpx>=0.27.0",

    # ---- Logging ----
    "structlog>=24.4.0",

    # ---- Reports ----
    "reportlab>=4.2.0",
    "openpyxl>=3.1.5",

    # ---- Utilities ----
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",          # Retry logic
    "ulid-py>=1.1.0",           # ULID for ordered UUIDs where needed
]

[project.optional-dependencies]
# Google Document AI
google = [
    "google-cloud-documentai>=2.29.0",
]

# Azure Document Intelligence
azure = [
    "azure-ai-formrecognizer>=3.3.0",
]

# Development tools
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",            # Test client for FastAPI
    "anyio[trio]>=4.6.0",

    # Code quality
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",

    # Database for tests
    "aiosqlite>=0.20.0",        # SQLite async for lightweight unit tests

    # Type stubs
    "sqlalchemy[mypy]>=2.0.35",
    "types-passlib>=1.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---- Ruff (linter + formatter) ----
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "S101",   # assert in tests is fine
    "ANN101", # self annotation
    "ANN102", # cls annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---- MyPy ----
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]

# ---- Coverage ----
[tool.coverage.run]
source = ["app"]
omit = [
    "app/infrastructure/database/migrations/*",
    "tests/*",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
