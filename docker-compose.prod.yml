# ============================================================
# Docker Compose — Producción (VPS Hardening)
# ============================================================
# Uso:
#   1. ./scripts/init_ssl.sh (Generar certificados bootstrap/Let's Encrypt)
#   2. ./scripts/deploy_prod.sh (Despliegue automatizado con migraciones y health check)
# ============================================================

name: proyecto-hv-prod

services:

  # ----------------------------------------------------------
  # 1. Base de Datos Relacional (PostgreSQL 16)
  # Puertos internos únicamente, afinamiento para VPS
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hv_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_hv}
      POSTGRES_USER: ${POSTGRES_USER:-hv_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error_POSTGRES_PASSWORD_requerida_en_produccion}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=es_CO.UTF-8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hv_app} -d ${POSTGRES_DB:-proyecto_hv}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hv_network_prod

  # ----------------------------------------------------------
  # 2. Caché y Cola en Memoria (Redis 7)
  # Autenticación obligatoria, persistencia AOF
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hv_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?Error_REDIS_PASSWORD_requerida_en_produccion}"
      --appendonly yes
      --save 60 1000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hv_network_prod

  # ----------------------------------------------------------
  # 3. Servidor de Aplicaciones Backend (FastAPI + Gunicorn)
  # Ejecución multi-worker no-root, sin puertos públicos
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: hv_backend_prod
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_LOCAL_PATH: /app/data/documents
      BACKUP_STORAGE_PATH: /app/data/backups
    volumes:
      - documents_prod_data:/app/data/documents
      - backups_prod_data:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hv_network_prod

  # ----------------------------------------------------------
  # 4. Procesador Asíncrono en Segundo Plano (ARQ Worker)
  # ----------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: hv_worker_prod
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_LOCAL_PATH: /app/data/documents
      BACKUP_STORAGE_PATH: /app/data/backups
    volumes:
      - documents_prod_data:/app/data/documents
      - backups_prod_data:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "arq", "app.workers.document_processing.tasks.WorkerSettings"]
    networks:
      - hv_network_prod

  # ----------------------------------------------------------
  # 5. Proxy Inverso y Terminador TLS (Nginx 1.25)
  # Único punto de entrada expuesto al exterior (80 y 443)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: hv_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl_data:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hv_network_prod

# ============================================================
# Volúmenes Persistentes de Producción
# ============================================================
volumes:
  postgres_prod_data:
    name: hv_postgres_prod_data
  redis_prod_data:
    name: hv_redis_prod_data
  documents_prod_data:
    name: hv_documents_prod_data
  backups_prod_data:
    name: hv_backups_prod_data
  nginx_ssl_data:
    name: hv_nginx_ssl_data
  certbot_data:
    name: hv_certbot_data
  nginx_logs:
    name: hv_nginx_logs

# ============================================================
# Red Interna Aislada de Producción
# ============================================================
networks:
  hv_network_prod:
    name: hv_network_prod
    driver: bridge
